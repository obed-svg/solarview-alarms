name: solarview-alarms

x-app: &app
  image: solarview-alarms:${IMAGE_TAG:-local}
  env_file:
    - ${DEPLOY_ENV_FILE:-.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgresql://${POSTGRES_USER:-solarview}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/${POSTGRES_DB:-solarview_alarms}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  init: true
  restart: unless-stopped
  networks:
    - backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarview_alarms}
      POSTGRES_USER: ${POSTGRES_USER:-solarview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  web:
    <<: *app
    build:
      context: .
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-2}
      - --timeout=120
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - staticfiles:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --queues=default,evaluation,notifications,sync
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    stop_grace_period: 5m

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST es obligatorio}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - backend

volumes:
  pgdata:
  redisdata:
  staticfiles:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
